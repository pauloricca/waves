play:
  context:
    is_reusable: true
    p: 0
    s: .2
    l: .5
    v: 1
    pan: 0
    signal:
      track:
        volume: v
        pan: pan
        signal:
          envelope:
            attack: 0.01
            sustain_duration: 1
            release: 0.5
            end: true
            signal:
              buffer:
                name: sample
                monitor: true
                start: p
                end: p + l
                loop: true
                speed: s

