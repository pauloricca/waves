        play:
          context:
            note:
              automation:
                interval: bar
                steps:
                  - 0.2
                  - 
                  - 
                  - 0.3
                  - 0.25
                  - 0.22
            voice_pan:
              osc:
                type: perlin
                range: [-.5, .5]
            signal:
              sequencer:
                interval: sixteenth
                monitor: true
                steps:
                  - [kick, play]
                  - 
                  - [play p.5 s=note pan=voice_pan]
                  - [play p0.7 prob.3]
                  - [kick, play s.5 prob=cycle%2, play s.45 prob=1-cycle%2, csnare]
                  - play p.7 prob.2
                  - [play s0.2]
                  - play p.7 prob.2
