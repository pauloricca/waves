playhead:
  context:
    is_reusable: true
    s: 0
    signal:
      envelope:
        attack: 0.01
        sustain_duration: 0
        release: 0.5
        end: true
        signal:
          buffer:
            name: sample
            monitor: true
            start: s
            end: s + 0.5
            loop: true
            speed: 0.2

samplecer:
  tempo:
    bpm: 113
    signal:
      mix:
        duration: 99999
        sample:
          track:
            volume: 0
            signal:
              buffer:
                # loop: false
                name: sample
                length: 1
                signal:
                  fold:
                    threshold:
                      osc:
                        freq: 0.02
                        range: [0.1, 1]
                    signal:
                      # expression:
                      #   exp: signal * 60
                      #   signal:
                      #     input: {}
                      expression:
                        exp: amp * (transform * low + (1 - transform) * high)
                        transform:
                          osc:
                            freq: 0.05
                            range: [0, 1]
                        amp:
                          osc:
                            freq: 1
                            range: [0.5, 0.9]
                        low:
                          osc:
                            freq:
                              osc:
                                freq: 3
                                range: [150, 600]
                        high:
                          osc:
                            phase: 0.5
                            freq:
                              osc:
                                freq: 3
                                range: [1500, 2000]
                          
        play:
          sequencer:
            interval: sixteenth
            monitor: true
            steps:
              - kick vol.5, playhead
              - 
              - playhead s0.5
              - playhead s0.7
              - kick vol.6, playhead s0.8, csnare, clap
              -
              - playhead s0.2, csnare
              - 

